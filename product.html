  <title>Product — MindPill</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>" />

    window.Brevo = window.Brevo || [];
    Brevo.push(["init", { client_key: "xhq5nkaphkwmt2fu1ct4hikz" }]);
  </script>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P4Z6LJK8"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <header>
    <div class="wrap nav">
      <a href="index.html" class="brand"><span class="dot">💊</span> MindPill</a>
      <nav class="nav-links">
        <a href="store.html">Store</a>
        <a href="waitlist.html">Waitlist</a>
        <a href="checkout.html" class="btn btn-primary">Cart <span class="cart-badge" data-cart-count style="display:none;">0</span></a>
      </nav>
    </div>
  </header>

  <main class="wrap page">
    <a href="store.html" class="back-link">← Back to store</a>
    <div id="product-view"></div>
  </main>

  <footer>
    <div class="wrap">
      <p class="disclaimer">Demo store. Viewing this page fires an enriched Brevo <code>page</code> event with the product details. No real products ship.</p>
    </div>
  </footer>

  <script src="app.js?v=2"></script>
  <script>
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    const id = getParam("id");
    const p = PRODUCTS[id];
    const view = document.getElementById("product-view");

    if (!p) {
      document.title = "Product not found — MindPill";
      view.innerHTML =
        '<div class="empty-state"><div style="font-size:3rem;">🤔</div>' +
        '<p style="margin:12px 0 20px;">That product doesn\'t exist.</p>' +
        '<a href="store.html" class="btn btn-primary">Back to the store</a></div>';
      // Still record the (missing) product view
      trackPage("product", { product_id: id || "unknown", product_found: false });
    } else {
      // Set a meaningful page title -> flows into the page event's ma_title
      document.title = p.name + " — MindPill";

      view.innerHTML =
        '<div class="layout-2" style="grid-template-columns: 1fr 1fr;">' +
          '<div class="product" style="max-width:none;">' +
            '<div class="thumb" style="font-size:8rem;">' + p.emoji + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="pill-badge" style="margin-bottom:16px;">' + p.category + '</div>' +
            '<h1 style="margin-bottom:12px;">' + p.name + '</h1>' +
            '<div class="price" style="font-size:2rem;font-weight:800;margin-bottom:16px;">$' + p.price + '</div>' +
            '<p class="lead" style="margin-bottom:28px;">' + p.blurb + '</p>' +
            '<button class="btn btn-primary" id="add-btn" style="min-width:200px;">Add to cart</button>' +
            '<a href="checkout.html" class="btn btn-ghost" style="margin-left:10px;">Go to checkout →</a>' +
          '</div>' +
        '</div>';

      document.getElementById("add-btn").addEventListener("click", function () {
        addToCart(id);           // fires cart_updated
        showToast("Added to cart");
      });

      // Build a rich set of properties from the page + cart context
      const cart = getCart();
      const enrich = {
        product_id:       id,
        product_name:     p.name,
        product_price:    p.price,
        currency:         "USD",
        product_category: p.category,
        product_emoji:    p.emoji,
        product_blurb:    p.blurb,
        product_url:      window.location.href,
        brand:            "MindPill",
        in_stock:         true,
        page_section:     "product_detail",
        cart_items_count: cartCount(cart),   // how full their cart is right now
        cart_value:       cartTotal(cart),
        viewed_at:        new Date().toISOString()
      };

      // Enriched page view: reports WHICH product was viewed + full context.
      // TEST: "I Think Therefore I Am (Updated)" Tee (tee-think) is left INTENTIONALLY
      // bare here — no product data from code — so it can be enriched via GTM only.
      // Every other product keeps full code-side enrichment.
      if (id === "tee-think") {
        trackPage("product", {});     // bare page view: page_source + ma_ fields only
      } else {
        trackPage("product", enrich); // full enrichment from the site code
      }

      // --- TEST: identify by ext_id instead of email (only on the Opus tee page) ---
      // Docs note: the JS tracker normally REQUIRES email_id in identifiers and treats
      // EXT_ID as an attribute. This is a deliberate test to see Brevo's behavior.
      // https://developers.brevo.com/docs/identify-users-js
      if (id === "tee-opus") {
        window.Brevo = window.Brevo || [];
        Brevo.push([
          "identify",
          {
            identifiers: { ext_id: "cristiano_ronaldo" },
            attributes: { FIRSTNAME: "Cristiano", LASTNAME: "Ronaldo" }
          }
        ]);
        console.log("[MindPill test] identify by ext_id=cristiano_ronaldo fired");
      }
    }
  </script>
</body>
</html>
